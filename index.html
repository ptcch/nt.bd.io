<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎁 Un regalo ti aspetta...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c9a84c; --gold-l: #e8c97a; --gold-d: #7a5f2a;
      --bg: #0d0a07; --surface: #18130e; --text: #f0e8d8; --muted: #7a6e60; --error: #c95050;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Raleway', sans-serif; font-weight: 300; overflow-x: hidden; }

    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 20%, rgba(201,168,76,.12) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 40% at 80% 80%, rgba(201,168,76,.06) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: .5;
    }
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 100; }

    .scene {
      position: relative; z-index: 1; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem;
    }
    .ornament {
      font-family: 'Cormorant Garamond', serif; font-size: .75rem; letter-spacing: .4em;
      color: var(--gold-d); text-transform: uppercase; margin-bottom: 2.5rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .ornament::before, .ornament::after { content: ''; display: block; width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-d)); }
    .ornament::after { transform: scaleX(-1); }

    .card {
      background: var(--surface); border: 1px solid rgba(201,168,76,.15); border-radius: 2px;
      max-width: 460px; width: 100%; text-align: center;
      box-shadow: 0 0 80px rgba(201,168,76,.06), 0 2px 40px rgba(0,0,0,.6);
      position: relative; overflow: hidden;
      animation: fadeUp .8s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }

    /* corner ticks */
    .card::before, .card::after, .card .c-br, .card .c-bl { content: ''; position: absolute; width: 22px; height: 22px; border-color: var(--gold-d); border-style: solid; }
    .card::before  { top:12px; left:12px;  border-width: 1px 0 0 1px; }
    .card::after   { top:12px; right:12px; border-width: 1px 1px 0 0; }
    .card .c-br    { bottom:12px; right:12px; border-width: 0 1px 1px 0; }
    .card .c-bl    { bottom:12px; left:12px;  border-width: 0 0 1px 1px; }

    /* ── CARD BODY (shared padding) ── */
    .card-body { padding: 3.5rem 3rem; }

    /* ── GATE ── */
    .gift-icon { font-size: 3rem; display: block; margin-bottom: 1.2rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 400; letter-spacing: .06em; color: var(--gold-l); margin-bottom: .5rem; line-height: 1.2; }
    .subtitle { font-size: .82rem; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; margin-bottom: 2.5rem; }

    .input-wrap { position: relative; margin-bottom: 1rem; }
    .input-wrap input {
      width: 100%; background: rgba(255,255,255,.04); border: 1px solid rgba(201,168,76,.2); border-radius: 1px;
      color: var(--text); font-family: 'Raleway', sans-serif; font-weight: 300; font-size: 1rem;
      letter-spacing: .25em; text-align: center; padding: .9rem 1.2rem; outline: none;
      transition: border-color .3s, box-shadow .3s;
    }
    .input-wrap input::placeholder { color: var(--muted); letter-spacing: .1em; }
    .input-wrap input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,.08); }
    .input-wrap.shake { animation: shake .4s cubic-bezier(.36,.07,.19,.97); }
    @keyframes shake { 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-6px);} 40%,60%{transform:translateX(6px);} }
    .error-msg { font-size: .78rem; color: var(--error); letter-spacing: .05em; min-height: 1.2em; margin-bottom: .8rem; }

    .btn {
      width: 100%; background: linear-gradient(135deg, var(--gold-d), var(--gold), var(--gold-d));
      background-size: 200%; border: none; border-radius: 1px; color: var(--bg);
      font-family: 'Raleway', sans-serif; font-weight: 400; font-size: .82rem;
      letter-spacing: .3em; text-transform: uppercase; padding: .95rem 2rem;
      cursor: pointer; transition: background-position .5s, box-shadow .3s, transform .15s;
    }
    .btn:hover { background-position: right center; box-shadow: 0 0 30px rgba(201,168,76,.3); }
    .btn:active { transform: scale(.98); }
    .hint { margin-top: 2rem; font-size: .72rem; color: var(--muted); letter-spacing: .08em; font-style: italic; font-family: 'Cormorant Garamond', serif; }

    /* ── SUCCESS ── */
    .success-view { display: none; }
    .success-view.visible { display: block; animation: fadeUp .6s cubic-bezier(.16,1,.3,1) both; }
    .success-icon { font-size: 3.5rem; display: block; margin-bottom: .8rem; }
    .success-title { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--gold-l); font-style: italic; margin-bottom: .3rem; }
    .success-sub { font-size: .8rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2rem; }

    /* ── GIFT CARDS ── */
    .gift-cards { display: flex; flex-direction: column; gap: 1rem; text-align: left; }

    .gift-card { border: 1px solid rgba(201,168,76,.18); border-radius: 1px; overflow: hidden; }
    .gc-header { display: flex; align-items: center; gap: .7rem; padding: .8rem 1.2rem; }
    .gc-header.zalando { background: linear-gradient(135deg, #7a2d00, #cc4a00); }
    .gc-header.ryanair { background: linear-gradient(135deg, #031a4a, #073590); }
    .gc-brand { font-family: 'Raleway', sans-serif; font-size: .65rem; letter-spacing: .3em; color: rgba(255,255,255,.85); text-transform: uppercase; }
    .gc-icon { font-size: 1.2rem; }
    .gc-body { padding: 1rem 1.2rem; background: rgba(255,255,255,.03); }
    .gc-title { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--text); margin-bottom: .8rem; font-style: italic; }

    .download-btn {
      display: block; width: 100%; background: transparent;
      border: 1px solid rgba(201,168,76,.4); color: var(--gold-l); border-radius: 1px;
      padding: .65rem 1rem; font-family: 'Raleway', sans-serif; font-size: .7rem;
      letter-spacing: .25em; text-transform: uppercase; cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .download-btn:hover { background: rgba(201,168,76,.08); border-color: var(--gold); }

    .email-toggle {
      display: block; width: 100%; background: transparent;
      border: 1px solid rgba(7,53,144,.5); color: #8aadff; border-radius: 1px;
      padding: .65rem 1rem; font-family: 'Raleway', sans-serif; font-size: .7rem;
      letter-spacing: .25em; text-transform: uppercase; cursor: pointer;
      transition: background .2s; text-align: center;
    }
    .email-toggle:hover { background: rgba(7,53,144,.15); }

    .email-frame-wrap { display: none; margin-top: .8rem; border: 1px solid rgba(201,168,76,.1); border-radius: 1px; overflow: hidden; }
    .email-frame-wrap.open { display: block; animation: fadeUp .3s ease; }
    .email-frame-wrap iframe { width: 100%; border: none; display: block; height: 520px; }
  </style>
</head>
<body>
<canvas id="confetti"></canvas>

<div class="scene">
  <div class="ornament">buono regalo</div>

  <div class="card">
    <div class="c-br"></div><div class="c-bl"></div>
    <div class="card-body">

      <!-- GATE -->
      <div id="gateView">
        <span class="gift-icon">🎁</span>
        <h1>C'è qualcosa<br><em>per te</em></h1>
        <p class="subtitle">Inserisci la parola magica</p>
        <div class="input-wrap" id="inputWrap">
          <input type="password" id="pwInput" placeholder="password segreta" autocomplete="off" maxlength="30" />
        </div>
        <p class="error-msg" id="errMsg"></p>
        <button class="btn" onclick="checkPassword()">Apri il regalo →</button>
        <p class="hint">Hai ricevuto un indizio... usalo bene 🎼🎵 🎶 </p>
      </div>

      <!-- SUCCESS -->
      <div class="success-view" id="successView">
        <span class="success-icon">🥳</span>
        <h2 class="success-title">Auguri!</h2>
        <p class="success-sub">I tuoi regali ti aspettano</p>

        <div class="gift-cards">

          <!-- ZALANDO -->
          <div class="gift-card">
            <div class="gc-header zalando">
              <span class="gc-icon">🛍</span>
              <span class="gc-brand">Zalando — Buono Regalo</span>
            </div>
            <div class="gc-body">
              <p class="gc-title">Il tuo buono è pronto da scaricare</p>
              <button class="download-btn" onclick="downloadZalando()">⬇ &nbsp;Scarica il buono PDF</button>
            </div>
          </div>

          <!-- RYANAIR -->
          <div class="gift-card">
            <div class="gc-header ryanair">
              <span class="gc-icon">✈</span>
              <span class="gc-brand">Ryanair — Voucher di viaggio</span>
            </div>
            <div class="gc-body">
              <p class="gc-title">La tua mail di conferma Ryanair</p>
              <button class="email-toggle" onclick="toggleEmail(this)">📧 &nbsp;Mostra la mail Ryanair</button>
              <div class="email-frame-wrap" id="emailFrame">
                <iframe id="ryanairIframe" sandbox="allow-same-origin" scrolling="yes"></iframe>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

function checkPassword() {
  const val  = document.getElementById('pwInput').value.trim();
  const wrap = document.getElementById('inputWrap');
  const err  = document.getElementById('errMsg');
  if (val.toLowerCase() === CONFIG.password.toLowerCase()) {
    document.getElementById('gateView').style.display = 'none';
    document.getElementById('successView').classList.add('visible');
    document.getElementById('ryanairIframe').srcdoc = RYANAIR_EMAIL;
    launchConfetti();
  } else {
    err.textContent = 'Password errata… riprova 🔒';
    wrap.classList.remove('shake');
    void wrap.offsetWidth;
    wrap.classList.add('shake');
    document.getElementById('pwInput').value = '';
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
  document.getElementById('errMsg').textContent = '';
});

function toggleEmail(btn) {
  const f    = document.getElementById('emailFrame');
  const open = f.classList.toggle('open');
  btn.textContent = open ? '📧  Nascondi mail' : '📧  Mostra la mail Ryanair';
}

function downloadZalando() {
  if (CONFIG.zalandoBase64 === 'INSERISCI_QUI_BASE64_PDF') {
    alert('⚠️ Inserisci prima il base64 del PDF Zalando nel CONFIG!');
    return;
  }
  const b   = atob(CONFIG.zalandoBase64);
  const arr = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) arr[i] = b.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
  Object.assign(document.createElement('a'), { href: url, download: CONFIG.zalandoNomeFile }).click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

// Confetti
(function() {
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  let W, H, parts = [], running = false;
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  addEventListener('resize', resize); resize();
  const C = ['#c9a84c','#e8c97a','#f0e8d8','#c95050','#5aa87a','#7a84c9','#073590','#ff6900'];
  function P() {
    this.x=Math.random()*W; this.y=-14;
    this.r=Math.random()*7+4; this.c=C[Math.floor(Math.random()*C.length)];
    this.vx=(Math.random()-.5)*4; this.vy=Math.random()*3+2;
    this.an=Math.random()*Math.PI*2; this.av=(Math.random()-.5)*.2; this.li=1;
  }
  function loop() {
    if (!running) return;
    ctx.clearRect(0,0,W,H);
    parts.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.an+=p.av; p.li-=.005;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.an);
      ctx.globalAlpha=Math.max(0,p.li); ctx.fillStyle=p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); ctx.restore();
    });
    parts=parts.filter(p=>p.li>0&&p.y<H+20);
    if (!parts.length) { running=false; ctx.clearRect(0,0,W,H); return; }
    requestAnimationFrame(loop);
  }
  window.launchConfetti = () => {
    running=true;
    for (let i=0;i<180;i++) setTimeout(()=>parts.push(new P()),i*18);
    requestAnimationFrame(loop);
  };
})();
